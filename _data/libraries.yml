# URL-substring → library display-name rules; first match wins.
# URLs matching no rule fall back to their GitHub/GitLab repository name,
# then to the URL's hostname.
- match: "github.com/leanprover-community/mathlib4/"
  name: "Mathlib"
- match: "leanprover-community.github.io/1000.html"
  name: "Lean community"
- match: "leanprover.zulipchat.com/"
  name: "Lean community"
- match: "leanprover-community.github.io/mathlib"
  name: "Mathlib"
- match: "us.metamath.org/"
  name: "set.mm"
- match: "isabelle.in.tum.de/"
  name: "Isabelle/HOL"
- match: "isa-afp.org/"
  name: "AFP"
- match: "mizar.uwb.edu.pl/"
  name: "MML"
- match: "github.com/jrh13/hol-light"
  name: "HOL Light"
- match: "cse.unsw.edu.au/~kleing/top100"
  name: "Isabelle"
- match: "mizar.org/version/"
  name: "MML"
- match: "mizar.org/100"
  name: "MML"
- match: "cs.ru.nl/~freek/100/hol.html"
  name: "HOL Light"
- match: "leanprover-community.github.io/100.html"
  name: "Lean community"
- match: "madiot.fr/coq100"
  name: "Rocq"
- match: "web.archive.org/"
  name: "external"
- match: "github.com/rocq-prover/rocq/"
  name: "Rocq core"
- match: "github.com/rocq-prover/stdlib"
  name: "Stdlib"
- match: "github.com/math-comp/"
  name: "MathComp"
